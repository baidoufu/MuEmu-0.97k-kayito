; =========================================================================================================================================== ;
; MU Launcher Configuration                                                                                                                 ;
; =========================================================================================================================================== ;
; EnableTrusted=0 uses SQL Server authentication (User and Pass) to log in the SQL Server (Works to log in outside and inside of the VPS)  ;
; EnableTrusted=1 uses Windows authentication to log in the SQL Server (No User and Pass required, works only inside of the VPS)           ;
; =========================================================================================================================================== ;

[Database]
EnableTrusted=1
DataBaseHost=127.0.0.1
DataBasePort=1433
DataBaseName=MuOnline97
DataBaseUser=sa
DataBasePass=123456

[Launcher]
; Path to main.exe (relative or absolute)
MainExePath=.\main.exe

; Reset configuration
; Level required for reset (转生)
ResetLevel=400
; Points awarded per reset
ResetPoints=400

; Grand Reset configuration (转世)
; Resets required for grand reset
GrandResetResets=10
; Points awarded per grand reset
GrandResetPoints=100

; Clear PK (洗红) zen cost
ClearPKZenCost=1000000
